[package]
name = "harper-fulltext"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
description = "Tantivy full-text indexing for Node.js and Harper"
license = "Apache-2.0"
repository = "https://github.com/HarperFast/fulltext"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
node-api = ["dep:napi", "dep:napi-derive"]
phase0 = ["dep:async-trait", "dep:stable_deref_trait"]
test-panic = ["node-api", "phase0"]

[dependencies]
async-trait = { version = "=0.1.92", optional = true }
napi = { version = "=2.16.17", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "=2.16.13", optional = true }
stable_deref_trait = { version = "=1.2.1", optional = true }
tantivy = "=0.26.1"

[build-dependencies]
napi-build = "=2.4.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.bench]
lto = "thin"
codegen-units = 1
