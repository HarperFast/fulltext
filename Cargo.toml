[package]
name = "harper-fulltext"
version = "0.1.2"
edition = "2021"
rust-version = "1.90"
description = "Tantivy full-text indexing for Node.js and Harper"
license = "Apache-2.0"
repository = "https://github.com/HarperFast/fulltext"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
node-api = ["dep:napi", "dep:napi-derive"]
test-panic = ["node-api"]

[dependencies]
napi = { version = "=3.13.0", default-features = false, features = ["dyn-symbols", "napi8"], optional = true }
napi-derive = { version = "=3.6.9", optional = true }
tantivy = "=0.26.1"

[build-dependencies]
napi-build = "=2.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
