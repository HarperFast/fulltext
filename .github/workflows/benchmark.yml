name: Release benchmark

on:
  workflow_dispatch:
    inputs:
      documents:
        description: Product documents to index
        required: true
        default: '100000'
      queries:
        description: Queries per mixed workload
        required: true
        default: '500'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-gnu
            output: benchmark-native.json
          - os: ubuntu-22.04-arm
            target: linux-arm64-gnu
            output: benchmark-native-linux-arm64-gnu.json
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run native query matrix
        env:
          DOCUMENTS: ${{ inputs.documents || '100000' }}
          QUERIES: ${{ inputs.queries || '500' }}
          REVISION: ${{ github.event.release.tag_name || github.sha }}
        run: >-
          node scripts/run-local.mjs benchmarks/native.mjs
          --documents "$DOCUMENTS"
          --queries "$QUERIES"
          --revision "$REVISION"
          --output "${{ matrix.output }}"
      - name: Store workflow result
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-native-${{ matrix.target }}-${{ github.sha }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 90

  publish:
    if: ${{ github.event_name == 'release' && !cancelled() }}
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download benchmark result
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-native-*-${{ github.sha }}
          merge-multiple: true
      - name: Attach result to the GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" benchmark-native*.json --clobber
