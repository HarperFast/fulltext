name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.18.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-15
            node: '22.18.0'
          - os: macos-15
            node: '24'
          - os: windows-latest
            node: '22.18.0'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Enable Windows crash dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpDirectory = "$env:RUNNER_TEMP\fulltext-dumps"
          New-Item -ItemType Directory -Force -Path $dumpDirectory | Out-Null
          $registryPath = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\node.exe'
          New-Item -Force -Path $registryPath | Out-Null
          New-ItemProperty -Force -Path $registryPath -Name DumpFolder -PropertyType ExpandString -Value $dumpDirectory | Out-Null
          New-ItemProperty -Force -Path $registryPath -Name DumpType -PropertyType DWord -Value 2 | Out-Null
          New-ItemProperty -Force -Path $registryPath -Name DumpCount -PropertyType DWord -Value 10 | Out-Null
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - name: Run tests
        run: npm test
        env:
          CARGO_PROFILE_RELEASE_DEBUG: ${{ runner.os == 'Windows' && '1' || '0' }}
      - name: Analyze Windows crash dumps
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $debugger = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          $dumps = @(Get-ChildItem "$env:RUNNER_TEMP\fulltext-dumps\*.dmp" -ErrorAction SilentlyContinue)
          if (-not (Test-Path $debugger) -or $dumps.Count -eq 0) {
            Write-Output 'No Windows crash dump or debugger is available'
            exit 0
          }
          $symbols = "$(Resolve-Path target\debug);$(Resolve-Path target\release);srv*"
          foreach ($dump in $dumps) {
            & $debugger -z $dump.FullName -y $symbols -c '!analyze -v;~* kb;q'
          }
          exit 0
      - name: Upload Windows crash dumps
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-crash-dumps-node-${{ matrix.node }}
          path: ${{ runner.temp }}/fulltext-dumps/*.dmp
          if-no-files-found: warn
          retention-days: 3
      - run: git diff --exit-code -- ts/addon.d.ts

  supply-chain:
    name: Supply chain and native linkage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: taiki-e/install-action@cargo-deny
      - run: npm ci --ignore-scripts
      - run: cargo deny check
      - run: npm audit --audit-level=high
      - run: npm run build:native
      - name: Reject linked RocksDB symbols
        run: |
          set -euo pipefail
          artifact=fulltext.linux-x64-gnu.node
          test -f "$artifact"
          cargo tree --locked --all-features > "$RUNNER_TEMP/fulltext-cargo-tree.txt"
          if grep -qi rocksdb "$RUNNER_TEMP/fulltext-cargo-tree.txt"; then exit 1; fi
          nm -D --defined-only "$artifact" > "$RUNNER_TEMP/fulltext-symbols.txt"
          test -s "$RUNNER_TEMP/fulltext-symbols.txt"
          grep -q napi_register_module_v1 "$RUNNER_TEMP/fulltext-symbols.txt"
          if grep -qi rocksdb "$RUNNER_TEMP/fulltext-symbols.txt"; then exit 1; fi
          ldd "$artifact" > "$RUNNER_TEMP/fulltext-linkage.txt"
          test -s "$RUNNER_TEMP/fulltext-linkage.txt"
          if grep -qi rocksdb "$RUNNER_TEMP/fulltext-linkage.txt"; then exit 1; fi
      - name: Verify unwind profile
        run: cargo rustc --locked --release --features node-api -- --print cfg | grep 'panic="unwind"'

  benchmark-smoke:
    name: Native benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - run: npm run build:typescript
      - name: Run logical mutation benchmark smoke
        run: node scripts/run-local.mjs benchmarks/native.mjs --smoke --mutation-driver logical --output benchmark-logical.json
      - name: Run low-level mutation benchmark smoke
        run: node scripts/run-local.mjs benchmarks/native.mjs --smoke --mutation-driver low-level --output benchmark-low-level.json
      - run: npm run benchmark:inspect:smoke
      - name: Store benchmark smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-${{ github.sha }}
          path: benchmark-*.json
          if-no-files-found: warn
          retention-days: 30
