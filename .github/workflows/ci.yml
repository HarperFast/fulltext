name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.18.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-15
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Enable Windows native crash diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $dumpDirectory = Join-Path $env:RUNNER_TEMP 'fulltext-crash-dumps'
          New-Item -ItemType Directory -Force -Path $dumpDirectory | Out-Null
          $registryPath = 'HKLM:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\node.exe'
          New-Item -Path $registryPath -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpFolder -PropertyType ExpandString -Value $dumpDirectory -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpCount -PropertyType DWord -Value 4 -Force | Out-Null
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - name: Test
        id: tests
        run: npm test
      - name: Analyze Windows native crash
        if: always() && runner.os == 'Windows' && steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          $dumpDirectory = Join-Path $env:RUNNER_TEMP 'fulltext-crash-dumps'
          $dumps = if (Test-Path $dumpDirectory) {
            Get-ChildItem $dumpDirectory -Filter '*.dmp' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime
          }
          if (-not $dumps) {
            Write-Warning 'Windows Error Reporting did not produce a minidump.'
            exit 0
          }
          Write-Host 'Captured native crash dumps:'
          $dumps | ForEach-Object { Write-Host "  $($_.Name)" }

          $debuggerPath = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (-not (Test-Path $debuggerPath)) {
            $sdk = Get-ItemProperty 'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' |
              Where-Object { $_.DisplayName -match 'Windows Software Development Kit' } |
              Sort-Object DisplayVersion -Descending |
              Select-Object -First 1
            if (-not $sdk.BundleCachePath) {
              throw 'Windows SDK installer is unavailable; cannot install cdb.exe.'
            }
            $install = Start-Process -FilePath $sdk.BundleCachePath -ArgumentList @(
              '/features', 'OptionId.WindowsDesktopDebuggers', '/q', '/norestart'
            ) -PassThru
            if (-not $install.WaitForExit(120000)) {
              try {
                $install.Kill($true)
              } catch [System.InvalidOperationException] {
              }
              if (-not $install.WaitForExit(10000)) {
                throw 'Windows Desktop Debuggers installer could not be stopped after timing out.'
              }
              if (-not (Test-Path $debuggerPath)) {
                throw 'Windows Desktop Debuggers installation timed out.'
              }
            }
            if ($install.ExitCode -ne 0 -or -not (Test-Path $debuggerPath)) {
              throw "Windows Desktop Debuggers installation failed with exit code $($install.ExitCode)."
            }
          }
          $symbolPaths = @(
            $pwd,
            (Join-Path $pwd 'target\debug'),
            (Join-Path $pwd 'target\debug\deps')
          ) -join ';'
          $commands = '.reload; k; !analyze -v; q'

          foreach ($dump in $dumps) {
            Write-Host "Analyzing $($dump.Name)"
            $stdout = Join-Path $env:RUNNER_TEMP "$($dump.BaseName)-cdb.out"
            $stderr = Join-Path $env:RUNNER_TEMP "$($dump.BaseName)-cdb.err"
            $debugger = Start-Process -FilePath $debuggerPath -ArgumentList @(
              '-sins', '-y', $symbolPaths, '-z', $dump.FullName, '-c', $commands
            ) -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $debugger.WaitForExit(120000)) {
              try {
                $debugger.Kill($true)
              } catch [System.InvalidOperationException] {
              }
              if (-not $debugger.WaitForExit(10000)) {
                Write-Warning "cdb.exe could not be stopped after timing out on $($dump.Name)."
              } else {
                Write-Warning "cdb.exe timed out while analyzing $($dump.Name)."
              }
            }
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
          }
      - name: Remove Windows native crash diagnostics
        if: always() && runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Remove-Item 'HKLM:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\node.exe' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP 'fulltext-crash-dumps') -Recurse -Force -ErrorAction SilentlyContinue
      - run: git diff --exit-code -- ts/addon.d.ts

  supply-chain:
    name: Supply chain and native linkage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: taiki-e/install-action@cargo-deny
      - run: npm ci --ignore-scripts
      - run: cargo deny check
      - run: npm audit --audit-level=high
      - run: npm run build:native
      - name: Reject linked RocksDB symbols
        run: |
          set -euo pipefail
          artifact=fulltext.linux-x64-gnu.node
          test -f "$artifact"
          if cargo tree --locked --all-features | grep -qi rocksdb; then exit 1; fi
          nm -D --defined-only "$artifact" > "$RUNNER_TEMP/fulltext-symbols.txt"
          test -s "$RUNNER_TEMP/fulltext-symbols.txt"
          grep -q napi_register_module_v1 "$RUNNER_TEMP/fulltext-symbols.txt"
          if grep -qi rocksdb "$RUNNER_TEMP/fulltext-symbols.txt"; then exit 1; fi
          ldd "$artifact" > "$RUNNER_TEMP/fulltext-linkage.txt"
          test -s "$RUNNER_TEMP/fulltext-linkage.txt"
          if grep -qi rocksdb "$RUNNER_TEMP/fulltext-linkage.txt"; then exit 1; fi
      - name: Verify unwind profile
        run: cargo rustc --locked --release --features node-api -- --print cfg | grep 'panic="unwind"'

  benchmark-smoke:
    name: Native benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - run: npm run build:typescript
      - run: npm run benchmark:smoke
      - run: npm run benchmark:inspect:smoke
