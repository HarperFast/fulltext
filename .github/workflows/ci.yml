name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.18.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-15
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Enable Windows native minidumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpDirectory = Join-Path $env:RUNNER_TEMP 'fulltext-crash-dumps'
          New-Item -ItemType Directory -Force -Path $dumpDirectory | Out-Null
          $registryPath = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\node.exe'
          New-Item -Path $registryPath -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpFolder -PropertyType ExpandString -Value $dumpDirectory -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpCount -PropertyType DWord -Value 4 -Force | Out-Null
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - name: Analyze Windows native crash
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $dump = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'fulltext-crash-dumps') -Filter '*.dmp' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $dump) {
            Write-Warning 'Windows Error Reporting did not produce a minidump.'
            exit 0
          }
          $debugger = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $debugger) {
            Write-Warning 'cdb.exe is not installed on this runner.'
            exit 0
          }
          $symbolDirectory = Join-Path $pwd 'target\debug'
          $commands = ".symfix; .sympath+ $symbolDirectory; .reload; !analyze -v; k; q"
          & $debugger.FullName -z $dump.FullName -c $commands
      - run: git diff --exit-code -- ts/addon.d.ts

  supply-chain:
    name: Supply chain and native linkage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: taiki-e/install-action@cargo-deny
      - run: npm ci --ignore-scripts
      - run: cargo deny check
      - run: npm audit --audit-level=high
      - run: npm run build:native
      - name: Reject linked RocksDB symbols
        run: |
          set -euo pipefail
          artifact=fulltext.linux-x64-gnu.node
          test -f "$artifact"
          if cargo tree --locked --all-features | grep -qi rocksdb; then exit 1; fi
          nm -D --defined-only "$artifact" > "$RUNNER_TEMP/fulltext-symbols.txt"
          test -s "$RUNNER_TEMP/fulltext-symbols.txt"
          grep -q napi_register_module_v1 "$RUNNER_TEMP/fulltext-symbols.txt"
          if grep -qi rocksdb "$RUNNER_TEMP/fulltext-symbols.txt"; then exit 1; fi
          ldd "$artifact" > "$RUNNER_TEMP/fulltext-linkage.txt"
          test -s "$RUNNER_TEMP/fulltext-linkage.txt"
          if grep -qi rocksdb "$RUNNER_TEMP/fulltext-linkage.txt"; then exit 1; fi
      - name: Verify unwind profile
        run: cargo rustc --locked --release --features node-api -- --print cfg | grep 'panic="unwind"'

  benchmark-smoke:
    name: Native benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - run: npm run build:typescript
      - run: npm run benchmark:smoke
      - run: npm run benchmark:inspect:smoke
