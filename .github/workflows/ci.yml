name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.18.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-14
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  supply-chain:
    name: Supply chain and native linkage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: taiki-e/install-action@cargo-deny
      - run: npm ci --ignore-scripts
      - run: cargo deny check
      - run: npm audit --audit-level=high
      - run: npm run build:native
      - name: Reject linked RocksDB symbols
        run: |
          set -euo pipefail
          artifact=fulltext.linux-x64-gnu.node
          test -f "$artifact"
          if cargo tree --locked --all-features | grep -qi rocksdb; then exit 1; fi
          if nm --defined-only "$artifact" | grep -qi rocksdb; then exit 1; fi
          if ldd "$artifact" | grep -qi rocksdb; then exit 1; fi
      - name: Verify unwind profile
        run: cargo rustc --locked --release --features node-api -- --print cfg | grep 'panic="unwind"'
